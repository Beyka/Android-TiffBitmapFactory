// Local application integration. The library's standalone/publishing build is retained.
plugins { id 'com.android.library' }

android {
    namespace 'org.beyka.tiffbitmapfactory'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'softwarename', '"Android-TiffBitmapFactory-0.9.9.2"'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        externalNativeBuild { ndkBuild { arguments 'NDK_APPLICATION_MK:=src/main/jni/Application.mk' } }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.androidTest.assets.srcDir 'src/androidTest/assets'
    lint { abortOnError true }
}
dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
