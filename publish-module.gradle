apply plugin: 'maven-publish'
apply plugin: 'signing'

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    if (project.plugins.findPlugin("com.android.library")) {
        // For Android libraries
        from android.sourceSets.main.java.srcDirs
    } else {
        // For pure Kotlin libraries, in case you have them
        from sourceSets.main.java.srcDirs
    }
}

task javadoc(type: Javadoc) {
    failOnError false
    source = android.sourceSets.main.java.sourceFiles
    classpath += project.files(android.bootClasspath.join(File.pathSeparator))
}

afterEvaluate {
    android.libraryVariants.all { variant ->
        if (variant.name == 'release') {
            javadoc.classpath += variant.javaCompileProvider.get().classpath
        }
    }
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

artifacts {
    archives androidSourcesJar
    archives javadocJar
}

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId PUBLISH_GROUP_ID
                artifactId PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION
                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    from components.java
                }

                artifact androidSourcesJar
                artifact javadocJar

                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = 'TiffBitmapFactory is an Android library that allows opening and saving images in *.tif format on Android devices.'
                    url = 'https://github.com/Beyka/Android-TiffBitmapFactory'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/Beyka/Android-TiffBitmapFactory/blob/master/license.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'beyka'
                            name = 'Aleksey Bey'
                            email = 'beyka.dev@gmail.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/beyka/Android-TiffBitmapFactory.git'
                        developerConnection = 'scm:git:ssh://github.com/beyka/Android-TiffBitmapFactory.git'
                        url = 'https://github.com/Beyka/Android-TiffBitmapFactory/tree/master/'
                    }
                }
            }
        }

    }
}

def hasSigningKey = rootProject.ext["signing.keyId"] && rootProject.ext["signing.key"]
if (hasSigningKey) {
    signing {
        useInMemoryPgpKeys(
                rootProject.ext["signing.keyId"],
                rootProject.ext["signing.key"],
                rootProject.ext["signing.password"],
        )
        sign publishing.publications
    }
}